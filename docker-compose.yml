services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-steambot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-steambot}
      POSTGRES_DB: ${POSTGRES_DB:-steambot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-steambot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Внутри compose база доступна по имени сервиса db
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-steambot}:${POSTGRES_PASSWORD:-steambot}@db:5432/${POSTGRES_DB:-steambot}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python main.py"

volumes:
  pgdata:
